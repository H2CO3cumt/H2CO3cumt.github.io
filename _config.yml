# ================================================================
# H2CO3cumt 博客主配置
# 常改内容：站点名称、副标题、网址、作者名和文章链接格式。
# 导航、Banner、头像与主页文案见 _config.butterfly.yml 和 source/_data/site.yml。
# ================================================================

title: H2CO3cumt
subtitle: FPGA · Verilog · Digital IC · Python
description: 记录 FPGA、Verilog、数字电路、Robei EDA、Python 与工程实践的个人技术博客。
keywords:
  - FPGA
  - Verilog
  - SystemVerilog
  - 数字电路
  - Digital IC
  - Robei EDA
  - Python
author: H2CO3cumt
language: zh-CN
timezone: Asia/Shanghai

# GitHub Pages 用户站点使用根路径 /，不要改成仓库子目录。
url: https://H2CO3cumt.github.io
root: /
permalink: posts/:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false

prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 8
  order_by: -date

per_page: 10
pagination_dir: page
theme: butterfly

# 本地静态搜索：JSON 索引包含文章标题、正文、标签与分类。
search:
  path: search.json
  field: post
  content: true

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 280
  content_limit_delim: ' '
  order_by: -date

sitemap:
  path: sitemap.xml
  rel: true
  tags: true
  categories: true

marked:
  gfm: true
  pedantic: false
  breaks: false
  smartLists: true
  smartypants: false
  headerIds: true
  lazyload: true
  figcaption: true
  prependRoot: true
  postAsset: false
  sanitizeUrl: true
  external_link:
    enable: true
    exclude:
      - H2CO3cumt.github.io
    nofollow: false

meta_generator: true
updated_option: mtime

deploy:
  type: ''

