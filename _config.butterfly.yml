# ================================================================
# Butterfly 主题覆盖配置（不修改 node_modules 中的主题源码）
# 常改内容：导航、头像、Banner、社交链接、颜色与侧边栏。
# ================================================================

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  文章: /articles/ || fas fa-book-open
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  归档: /archives/ || fas fa-archive
  项目: /projects/ || fas fa-microchip
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/H2CO3cumt || GitHub || '#0b2742'
  fas fa-rss: /atom.xml || RSS || '#167d9a'

favicon: /images/favicon.svg
avatar:
  img: /images/avatar/avatar-placeholder.svg
  effect: false

disable_top_img: false
# 可将下面的 CSS 背景替换成 /images/banner.jpg。
default_top_img: 'linear-gradient(135deg, #071d31 0%, #0b3551 52%, #0c6a83 100%)'
index_img: 'linear-gradient(135deg, #061a2d 0%, #0a3552 52%, #0b6a82 100%)'
archive_img: 'linear-gradient(135deg, #071d31 0%, #0d405d 100%)'
tag_img: 'linear-gradient(135deg, #071d31 0%, #0d526c 100%)'
category_img: 'linear-gradient(135deg, #071d31 0%, #0d526c 100%)'
footer_img: false
background: '#f3f7fa'

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - 'linear-gradient(135deg, #0a2b45, #0d7891)'
    - 'linear-gradient(135deg, #102b46, #397e9b)'

error_img:
  flink: /images/favicon.svg
  post_page: /images/favicon.svg
error_404:
  enable: true
  subtitle: 页面不存在，返回博客继续浏览。
  background: 'linear-gradient(135deg, #061a2d, #0b6a82)'

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

index_site_info_top: 44%
index_top_img_height: 78vh
subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - FPGA · Verilog · Digital IC · Python

index_layout: 3
index_post_content:
  method: 2
  length: 220

code_blocks:
  theme: ocean
  macStyle: true
  height_limit: 720
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: true

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: true
  scroll_percent: true

post_copyright:
  enable: false
related_post:
  enable: true
  limit: 4
  date_type: created
post_pagination: 1
noticeOutdate:
  enable: true
  style: flat
  limit_day: 540
  position: top
  message_prev: 距离本文最后更新已过去
  message_next: 天，文中工具版本或结论可能已有变化。

footer:
  # 5.7 的 footer.nav 为多列分组结构；此博客保持轻量页脚，导航仍在顶部。
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: 保持记录，持续验证。

aside:
  enable: true
  hide: false
  button: true
  mobile: false
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: FPGA · Verilog · Digital IC · Python
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/H2CO3cumt
  card_announcement:
    enable: true
    content: 记录学习、工程实践与技术探索
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 24
    color: false
    orderby: name
    order: 1
  card_archives:
    enable: true
    type: yearly
    format: YYYY
    order: -1
    limit: 6
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

readmode: true
darkmode:
  enable: true
  button: true
  autoChangeMode: 1
rightside_scroll_percent: true
rightside_config_animation: false

anchor:
  auto_update: false
  click_to_scroll: true
photofigcaption: true
copy:
  enable: true
  copyright:
    enable: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use: mathjax
  per_page: false
  hide_scrollbar: false
  mathjax:
    enableMenu: false
    tags: none

search:
  use: local_search
  placeholder: 搜索文章标题、正文或标签…
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: true
    pagination:
      enable: true
      hitsPerPage: 8

share:
  use:
comments:
  use:

theme_color:
  enable: true
  main: '#0b6480'
  paginator: '#0b6480'
  button_hover: '#1689a7'
  text_selection: '#6dc7d8'
  link_color: '#167d9a'
  meta_color: '#6b7d8c'
  hr_color: '#b9d9e2'
  code_foreground: '#0b6480'
  code_background: 'rgba(11, 100, 128, 0.08)'
  toc_color: '#0b6480'
  blockquote_padding_color: '#0b6480'
  blockquote_background_color: '#eef7f9'
  scrollbar_color: '#0b6480'
  meta_theme_color_light: '#f3f7fa'
  meta_theme_color_dark: '#0b1219'

rounded_corners_ui: true
text_align_justify: false
mask:
  header: true
  footer: true
enter_transitions: false
display_mode: light
font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: 'Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif'
  code_font_family: '"JetBrains Mono", "Cascadia Code", Consolas, monospace'
blog_title_font:
  font_family: 'Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif'

lightbox: medium_zoom
mermaid:
  enable: true
  code_write: false
  theme:
    light: neutral
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

preloader:
  enable: false
activate_power_mode:
  enable: false
canvas_ribbon:
  enable: false
canvas_fluttering_ribbon:
  enable: false
canvas_nest:
  enable: false
fireworks:
  enable: false
click_heart:
  enable: false
clickShowText:
  enable: false

lazyload:
  enable: true
  native: true
  field: site
pjax:
  enable: false
instantpage: false

Open_Graph_meta:
  enable: true
structured_data:
  enable: true
  alternate_name:
    - H2CO3cumt 技术博客

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
    - <link rel="alternate" type="application/atom+xml" title="H2CO3cumt RSS" href="/atom.xml">
  bottom:
    - <script defer src="/js/custom.js"></script>

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
